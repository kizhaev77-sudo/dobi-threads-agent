name: Dobi Threads agent

on:
  schedule:
    # Основной запуск — цепочка: каждый запуск сам запускает следующий в :15 (шаг «Next run»).
    # Это расписание GitHub — запасное: перезапускает цепочку, если она оборвалась.
    # Если два запуска пришли в один час, второй посты не публикует (hours_between_posts в config.json)
    - cron: "15 4-20 * * *"
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "status = только проверка, dry = пробный без публикаций, run = по-настоящему"
        default: "status"
        type: choice
        options: [status, dry, run]

permissions:
  contents: write            # чтобы сохранять state.json в репозиторий
  actions: write             # чтобы запускать следующий запуск цепочки

concurrency:
  group: dobi-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          if [ "$MODE" = "status" ]; then python agent.py status
          elif [ "$MODE" = "dry" ]; then DRY_RUN=1 python agent.py run
          else python agent.py run; fi
      - name: Save state
        if: always()
        run: |
          git config user.name "dobi-agent"
          git config user.email "dobi-agent@users.noreply.github.com"
          git add state.json || true
          git commit -m "state $(date -u +%F_%H:%M)" || echo "нет изменений"
          # если во время запуска в репозиторий загружали файлы — сначала подтягиваем их
          git pull --rebase -X theirs origin main || true
          git push || true
      - name: Next run
        # Только в публичном репозитории: там минуты Actions бесплатны, а ожидание длится до часа
        if: ${{ !cancelled() && github.event.repository.private == false && (github.event_name == 'schedule' || github.event.inputs.mode == 'run') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( now / 3600 * 3600 + 900 ))
          [ "$next" -le $(( now + 60 )) ] && next=$(( next + 3600 ))
          echo "Следующий запуск в $(date -u -d @$next +%H:%M) UTC"
          sleep $(( next - now ))
          # если в очереди уже есть запуск (например, запасной по расписанию) — второй не нужен
          other=$(gh run list --workflow agent.yml --limit 20 --json status,databaseId \
            --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$other" = "0" ]; then gh workflow run agent.yml -f mode=run; else echo "Уже есть запуск в очереди"; fi
