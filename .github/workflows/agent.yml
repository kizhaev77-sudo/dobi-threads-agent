name: Dobi Threads agent

on:
  schedule:
    # Основной запуск — будильник cron-job.org (каждый час в :15, 07–23 МСК).
    # Это расписание GitHub — запасное: оно часто опаздывает или пропускает запуски.
    # Если оба пришли в один час, второй посты не публикует (hours_between_posts в config.json)
    - cron: "15 4-20 * * *"
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "status = только проверка, dry = пробный без публикаций, run = по-настоящему"
        default: "status"
        type: choice
        options: [status, dry, run]

permissions:
  contents: write            # чтобы сохранять state.json в репозиторий

concurrency:
  group: dobi-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          if [ "$MODE" = "status" ]; then python agent.py status
          elif [ "$MODE" = "dry" ]; then DRY_RUN=1 python agent.py run
          else python agent.py run; fi
      - name: Save state
        if: always()
        run: |
          git config user.name "dobi-agent"
          git config user.email "dobi-agent@users.noreply.github.com"
          git add state.json || true
          git commit -m "state $(date -u +%F_%H:%M)" || echo "нет изменений"
          # если во время запуска в репозиторий загружали файлы — сначала подтягиваем их
          git pull --rebase -X theirs origin main || true
          git push || true
